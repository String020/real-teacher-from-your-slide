name: Release Skill bundle

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skill.py
      - name: Extract release notes from CHANGELOG.md
        shell: python
        run: |
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(tag)}\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no '## {tag}' section")
          open("release-notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/a-real-teacher-from-your-slide.zip
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
