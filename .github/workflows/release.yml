name: Release Skill bundle

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/eval_case.py --check
      - run: python scripts/package_skill.py
      - run: python scripts/release_notes.py "$GITHUB_REF_NAME" --output release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/a-real-teacher-from-your-slide.zip
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
