name: Validate Skill bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/eval_case.py --check
      - run: python scripts/package_skill.py
      - uses: actions/upload-artifact@v7
        with:
          name: skill-bundle-${{ matrix.os }}
          path: dist/a-real-teacher-from-your-slide.zip
          if-no-files-found: error
